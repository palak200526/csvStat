[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csvstat-py"
version = "0.1.4"
description = "A lightweight command-line CSV data profiling tool"
readme = "package.md"
requires-python = ">=3.8"
license = "MIT"

authors = [
    {name = "Palak Grover"}
]

[project.scripts]
csvstat = "csvstat.cli:main"

[tool.setuptools.packages.find]
where = ["src"] 
